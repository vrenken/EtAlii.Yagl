[package]
name = "test-rust2"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
pest = "2.8.6"
pest_derive = "2.8.6"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
reqwest = { version = "0.13.3", features = ["json"] }
